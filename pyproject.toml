[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "incident-agent"
version = "0.1.0"
description = "Coding agent that investigates incidents with PagerDuty, Sentry and Elasticsearch."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "claude-agent-sdk>=0.2.140",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
incident-agent = "incident_agent.cli:main"

[tool.setuptools.packages.find]
include = ["incident_agent*"]
